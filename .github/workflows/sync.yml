name: Upstream Sync

permissions:
  contents: write

on:
  schedule:
    - cron: "0 4 * * *" # At 12PM UTC+8
  workflow_dispatch:

jobs:
  sync_latest_from_upstream:
    name: Sync latest commits from upstream repo
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.fork }}

    steps:
      - name: Reset backup-2025 to upstream main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA=$(gh api repos/LibreSpark/LibreTV/commits/main --jq .sha)
          echo "Upstream main is $SHA"
          curl -s -X PATCH \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/wittyconan/LibreTV/git/refs/heads/backup-2025 \
            -d "{\"sha\":\"$SHA\",\"force\":true}"
          echo "backup-2025 now points at upstream main"
